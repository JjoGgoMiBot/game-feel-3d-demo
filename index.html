<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전투 아레나 · 손맛 3D 데모</title>
<!-- 누가 보나: 손맛 모듈(멈춤·흔들림·줌·흡착·날씨·소리)이 3D 전투에서 어떻게 느껴지는지 직접 쳐 보는 사람. 1~2분 해 보고 숫자로 확인한다. -->
<style>
:root {
  --bg: #101114; --panel: #1a1b20; --line: #34363e; --text: #ececf0; --muted: #b4b6c0; --accent: #ffb340; --danger: #ff7a6b;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --fs-s: 13px; --fs-m: 15px; --fs-l: 22px;
  --t-fast: 150ms; --ease-out: cubic-bezier(.2, 0, 0, 1);
  --bar-h: 120px;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
canvas { display: block; width: 100%; touch-action: none; }
.stats { position: fixed; top: var(--s2); left: var(--s2); right: var(--s2); z-index: 10; display: grid;
  grid-template-columns: repeat(4, 1fr); gap: var(--s2); margin: 0; pointer-events: none; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: var(--s2) var(--s3); min-width: 0; }
.stat dt { font-size: var(--fs-s); color: var(--muted); }
.stat dd { margin: 0; font-size: var(--fs-l); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.low dd { color: var(--danger); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-top: 1px solid var(--line);
  padding: var(--s2) var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
label { display: flex; align-items: center; gap: var(--s1); font-size: var(--fs-s); color: var(--muted); }
select, button { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  font: inherit; font-size: var(--fs-m); padding: 0 var(--s3); }
button { cursor: pointer; transition: transform var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out); }
button:active { transform: scale(.96); }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details { font-size: var(--fs-s); color: var(--muted); }
summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
details ol { margin: 0 0 var(--s2); padding-left: var(--s5); max-height: 96px; overflow: auto; font-variant-numeric: tabular-nums; }
.touch { position: fixed; left: var(--s4); right: var(--s4); bottom: calc(var(--bar-h) + var(--s2)); z-index: 9; display: none;
  justify-content: space-between; align-items: flex-end; pointer-events: none; }
.touch > * { pointer-events: auto; }
.pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: var(--s1); }
.pad button { min-height: 48px; padding: 0; opacity: .85; }
.pad .u { grid-area: 1 / 2; } .pad .l { grid-area: 2 / 1; } .pad .r { grid-area: 2 / 3; } .pad .d { grid-area: 3 / 2; }
.atk { width: 88px; height: 88px; border-radius: 44px; font-size: var(--fs-m); opacity: .9; }
@media (pointer: coarse), (max-width: 700px) { .touch { display: flex; } }
.over { position: fixed; inset: 0 0 var(--bar-h) 0; z-index: 11; display: none; align-items: center; justify-content: center; flex-direction: column; gap: var(--s3); background: rgba(16, 17, 20, .72); }
.over.on { display: flex; }
.over p { margin: 0; font-size: var(--fs-l); }
@media (max-width: 420px) { .stat dd { font-size: var(--fs-m); } .stat { padding: var(--s2); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<dl class="stats" aria-label="요약">
  <div class="stat"><dt>처치</dt><dd id="sKill">0</dd></div>
  <div class="stat" id="sHpBox"><dt>체력</dt><dd id="sHp">5 / 5</dd></div>
  <div class="stat"><dt>최근 멈춤</dt><dd id="sStop">0 ms</dd></div>
  <div class="stat"><dt>동작</dt><dd id="sMove">-</dd></div>
</dl>
<canvas id="c" aria-label="3D 전투 아레나. 이동 WASD 또는 방향키, 공격 스페이스"></canvas>
<div class="over" id="over"><p>쓰러졌다</p><button class="primary" id="again">다시 시작</button></div>
<div class="touch">
  <div class="pad" aria-label="이동">
    <button class="u" data-k="up" aria-label="위">▲</button><button class="l" data-k="left" aria-label="왼쪽">◀</button>
    <button class="r" data-k="right" aria-label="오른쪽">▶</button><button class="d" data-k="down" aria-label="아래">▼</button>
  </div>
  <button class="atk primary" id="atkTouch">공격</button>
</div>
<div class="bar" id="bar">
  <div class="row">
    <label>속성 <select id="elem"></select></label>
    <label>무기 <select id="weap"></select></label>
    <label>날씨 <select id="wea"></select></label>
    <button id="snd" aria-pressed="false">소리 켜기</button>
  </div>
  <details>
    <summary>조작·기록 보기</summary>
    <p style="margin:0 0 8px">이동 WASD/방향키 · 공격 스페이스 또는 캔버스 클릭 · 앞쪽 적 쪽으로 살짝 끌려간다(흡착). 적의 바닥 원은 예고(1.2초 뒤 터짐).</p>
    <ol id="log"></ol>
  </details>
</div>

<script src="vfx-engine.js"></script>
<script src="presets.js"></script>
<script src="vfx-gl.js"></script>
<script src="vfx-set.js"></script>
<script src="bolt-fx.js"></script>
<script src="game-feel.js"></script>
<script src="game-feel-audio.js"></script>
<script>
'use strict';
/* 3D 전투 아레나. 그래픽은 VFX.Engine(검기·타격), 연출 시점·크기는 GameFeel, 소리는 GameFeelAudio.
   게임이 하는 일: 맞을 때 GameFeel.emit 한 번 → 결과의 hitstop·shake·zoom은 update()가 카메라·시간에 반영한다. */
const D = Math.PI / 180, UNIT = 100, PX = 50;   // 월드 1m = 프리셋 100px, GameFeel 좌표 = 월드 × 50
const ARENA = 6.8, PLAYER_HP = 5, TELE = 1.2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fx = new VFX.Engine();
fx.impactFrames = false; fx.camScale = 0;   // 흔들림·멈춤은 GameFeel 하나로만 (엔진 자체 연출은 끈다)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
GameFeel.configure({ vfx: window.VFXSet, const: reduce ? { shake: { amp: 3 }, zoom: { hit: 0.01, crit: 0.02, kill: 0.03 } } : {} });

const V3 = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
function perspective(fovy, aspect, near, far) { const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far); return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]; }
function lookAt(eye, at, up) {
  const z = V3.norm(V3.sub(eye, at)), x = V3.norm(V3.cross(up, z)), y = V3.cross(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
    -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]), -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]), -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]), 1];
}
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- 속성·무기·날씨 선택지 ---------- */
const ELEMS = window.VFXSet.ELEMS, WEAPS = window.VFXSet.WEAPONS;
const PRESET_OF = { wind: 'snow', metal: 'holy' };          // vfx-engine에 없는 속성은 가까운 프리셋으로
const presetOf = (k) => VFX.presets[PRESET_OF[k] || k] || VFX.presets.fire;
const COLOR = { fire: '#e8602c', ice: '#6fb8e0', lightning: '#d8c24a', poison: '#7cc04a', dark: '#8a62d0', holy: '#e6cf7a', arcane: '#c070e0', wind: '#8ad0c0', metal: '#a8aeb8' };
const elemSel = document.getElementById('elem'), weapSel = document.getElementById('weap'), weaSel = document.getElementById('wea');
ELEMS.forEach((e) => elemSel.add(new Option(e.ko, e.k)));
WEAPS.forEach((w) => weapSel.add(new Option(w.ko, w.k)));
const WEATHER_KO = { clear: '맑음', rain: '비', snow: '눈', storm: '폭풍', fog: '안개' };
Object.keys(GameFeel.CONST.weather.kinds).forEach((k) => weaSel.add(new Option(WEATHER_KO[k] || k, k)));
elemSel.value = 'fire'; weapSel.value = 'sword';
weapSel.addEventListener('change', () => { comboI = 0; });
weaSel.addEventListener('change', () => GameFeel.emit('weather', { kind: weaSel.value }));

/* ---------- 게임 상태 ---------- */
const P = { x: 0, z: 0, face: -Math.PI / 2, hp: PLAYER_HP, inv: 0, hurt: 0, ax: 0, az: 0 };
let enemies = [], kills = 0, atk = null, queued = false, cool = 0, dead = false, lastKey = '-', lastStop = 0, spawnT = 0;
const keys = {};
function resetGame() {
  Object.assign(P, { x: 0, z: 0, face: -Math.PI / 2, hp: PLAYER_HP, inv: 0, hurt: 0, ax: 0, az: 0 });
  enemies = []; kills = 0; atk = null; queued = false; cool = 0; dead = false; spawnT = 0; comboI = 0; comboT = 9; lastMove = '-'; shots.length = 0; bursts.length = 0; hitFx.length = 0; fx.clear(); GameFeel.reset();
  for (let i = 0; i < 4; i++) spawn(i * Math.PI / 2 + 0.6);
  document.getElementById('over').classList.remove('on'); hud();
}
const EN_ELEMS = ['fire', 'ice', 'lightning', 'poison'];
function spawn(a) {
  a = a == null ? rnd(0, Math.PI * 2) : a;
  enemies.push({ x: Math.cos(a) * 5.6, z: Math.sin(a) * 5.6, hp: 1, el: EN_ELEMS[Math.random() * 4 | 0], st: 'chase', t: 0, hurt: 0, kx: 0, kz: 0, dead: 0 });
}

/* ---------- 카메라 ---------- */
let W = 0, H = 0, dpr = 1, camAt = [0, 0.9, 0];
const YAW = 70 * D, PITCH = 40 * D, DIST = 12.5;
const FWD = [-Math.cos(YAW), -Math.sin(YAW)], RIGHT = [-FWD[1], FWD[0]];   // 화면 위쪽·오른쪽이 가리키는 바닥 방향
function camera(c) {
  const eye = [camAt[0] + DIST * Math.cos(PITCH) * Math.cos(YAW), camAt[1] + DIST * Math.sin(PITCH), camAt[2] + DIST * Math.cos(PITCH) * Math.sin(YAW)];
  const fov = 42 * D / c.zoom, focal = (H * dpr) / 2 / Math.tan(fov / 2), k = DIST / focal;
  const f = V3.norm(V3.sub(camAt, eye)), r = V3.norm(V3.cross(f, [0, 1, 0])), u = V3.cross(r, f);
  const off = V3.add(V3.mul(r, -c.x * dpr * k), V3.mul(u, c.y * dpr * k));   // GameFeel 흔들림(px)을 카메라 이동으로
  fx.camera3d({ view: lookAt(V3.add(eye, off), V3.add(camAt, off), u), proj: perspective(fov, W / H, 0.1, 100), unit: UNIT });
}

/* ---------- 맞았을 때: 연출은 한 번의 emit ---------- */
const logEl = document.getElementById('log'), logLines = [];
function connect(ev, who, target, o) {
  const r = GameFeel.emit(ev, Object.assign({ x: target.x * PX, y: target.z * PX }, o));
  if (!r) return null;
  lastKey = r.fx || '-';
  if (ev === 'tele') logLines.unshift(`${who} 예고 ${r.fx || '-'} · ${r.dur}초 뒤 터짐`);
  else { lastStop = Math.round(r.hitstop * 1000); logLines.unshift(`${who} ${ev} ${r.fx || '-'} · 멈춤 ${lastStop}ms · 흔들림 ${r.shake.toFixed(2)} · 줌 ×${r.zoom.toFixed(2)}`); }
  logLines.length = Math.min(logLines.length, 12);
  logEl.innerHTML = logLines.map((s) => '<li>' + s + '</li>').join('');
  if (ev === 'tele') return r;              // 예고는 소리·바닥 원만, 타격 이펙트는 터질 때
  const pre = presetOf(o.element);
  fx.impact(0, 0, pre, 0, { plane: fx.facing([target.x, 1.0, target.z]) });
  if (ev === 'kill' || o.crit) fx.impact(0, 0, pre, 0, { plane: fx.facing([target.x, 1.4, target.z]) });
  return r;
}
/* ---------- 동작표: 무기마다 동작 묶음. 휘두르는 면 = roll(0 세로·±45 사선·90 수평) × pitch(면을 위로 드는 각) → 구 전체로 기울어진다 ---------- */
const M = (n, o) => Object.assign({ n, type: 'slash', roll: 0, pitch: 0, a0: -130, a1: 40, reach: 2.4, arc: 65, hitAt: 0.5, wind: 0.08, swing: 0.1, end: 0.34, pow: [0.35, 0.75], h: 1.2, len: 250, w: 4 }, o);
const SET = {
  sword: [
    M('사선 내려베기', { roll: 45 }), M('반대 사선', { roll: -45, a0: -120, a1: 50 }),
    M('수평 가르기', { roll: 90, a0: -100, a1: 100, sweep: true, h: 1.1, reach: 2.6 }), M('올려베기', { roll: -35, pitch: 20, a0: 75, a1: -115, h: 0.9 }),
    M('돌려베기', { roll: 90, a0: -200, a1: 160, sweep: true, reach: 2.7, swing: 0.2, end: 0.5, h: 1.0, pow: [0.4, 0.8] }),
    M('찌르기', { type: 'thrust', reach: 3.4, arc: 22, a0: 0, a1: 0, swing: 0.1, end: 0.36, pow: [0.5, 0.85] }),
  ],
  axe: [
    M('내려찍기', { roll: 0, a0: -150, a1: 55, wind: 0.16, swing: 0.12, end: 0.52, pow: [0.6, 0.95], reach: 2.3, w: 7 }),
    M('횡베기', { roll: 90, a0: -110, a1: 90, sweep: true, wind: 0.14, swing: 0.14, end: 0.5, pow: [0.55, 0.9], w: 7, h: 1.0 }),
    M('회전 휘두르기', { roll: 80, a0: -200, a1: 160, sweep: true, wind: 0.12, swing: 0.24, end: 0.62, pow: [0.6, 0.95], reach: 2.7, w: 7, h: 1.0 }),
  ],
  dagger: [
    M('빠른 사선', { roll: 50, reach: 2.2, wind: 0.04, swing: 0.06, end: 0.18, pow: [0.2, 0.45], len: 120, w: 3 }),
    M('빠른 반대 사선', { roll: -50, a0: -120, a1: 50, reach: 2.2, wind: 0.04, swing: 0.06, end: 0.18, pow: [0.2, 0.45], len: 120, w: 3 }),
    M('역수 올려베기', { roll: -20, pitch: 15, a0: 70, a1: -100, reach: 2.2, wind: 0.04, swing: 0.06, end: 0.18, pow: [0.2, 0.45], len: 120, w: 3, h: 0.9 }),
    M('찌르기', { type: 'thrust', reach: 2.4, arc: 25, a0: 0, a1: 0, wind: 0.03, swing: 0.06, end: 0.16, pow: [0.25, 0.5], len: 120, w: 3 }),
  ],
  spear: [
    M('찌르기', { type: 'thrust', reach: 3.8, arc: 18, a0: 0, a1: 0, wind: 0.1, swing: 0.1, end: 0.4, pow: [0.5, 0.85], len: 320, w: 4 }),
    M('휩쓸기', { roll: 90, a0: -80, a1: 80, sweep: true, reach: 3.3, h: 0.7, swing: 0.14, end: 0.42, len: 320 }),
    M('올려 찌르기', { type: 'thrust', pitch: 28, reach: 3.6, arc: 22, a0: 0, a1: 0, wind: 0.1, swing: 0.1, end: 0.4, pow: [0.5, 0.85], len: 320 }),
  ],
};
// 원거리: 쏘는 속도·크기·위력·간격이 다르다. 마법서는 내 주위 전방위 폭발.
const SHOT = {
  staff: { fxs: 0.8, n: '마력구', speed: 9, r: 0.9, pow: [0.5, 0.85], wind: 0.18, end: 0.5, size: 22 },
  wand: { fxs: 0.4, n: '속사', speed: 15, r: 0.5, pow: [0.25, 0.5], wind: 0.05, end: 0.2, size: 11 },
  bow: { fxs: 0.55, n: '화살', pierce: true, speed: 24, r: 0.4, pow: [0.5, 0.9], wind: 0.14, end: 0.46, size: 8, arrow: true, max: 14 },
  bullet: { fxs: 0.5, n: '탄환', speed: 18, r: 0.45, pow: [0.3, 0.6], wind: 0.05, end: 0.24, size: 12 },
  throw: { fxs: 0.5, n: '투척', speed: 11, r: 0.6, pow: [0.4, 0.7], wind: 0.1, end: 0.4, size: 16, max: 8 },
};
const BURST = { n: '전방위 폭발', radius: 3.4, pow: [0.5, 0.9], wind: 0.25, end: 0.65 };
let comboI = 0, comboT = 9, lastMove = '-';
const shots = [], bursts = [], hitFx = [];

function planeFor(m) {   // 면의 +x는 앞(위로 pitch), +y는 roll만큼 기울어진 "아래"
  const f = [Math.cos(P.face), 0, Math.sin(P.face)], s = [-f[2], 0, f[0]], ph = m.pitch * D, ro = m.roll * D;
  const R = [f[0] * Math.cos(ph), Math.sin(ph), f[2] * Math.cos(ph)];
  let Dv = [s[0] * Math.sin(ro), -Math.cos(ro), s[2] * Math.sin(ro)];
  const dot = Dv[0] * R[0] + Dv[1] * R[1] + Dv[2] * R[2];
  return fx.plane([P.x, m.h, P.z], R, V3.norm(V3.sub(Dv, V3.mul(R, dot))));
}
function hitEnemy(e, m) {
  const crit = Math.random() < 0.2, power = clamp(rnd(m.pow[0], m.pow[1]) * (crit ? 1.2 : 1), 0, 1);
  e.hp -= power * (crit ? 1.8 : 1) * 0.65; e.hurt = 0.2; e.sq = 0;
  const d = Math.hypot(e.x - P.x, e.z - P.z) || 1; e.kx = (e.x - P.x) / d * 3; e.kz = (e.z - P.z) / d * 3;
  const kill = e.hp <= 0;
  connect(kill ? 'kill' : 'hit', '플레이어', e, { weapon: weapSel.value, element: elemSel.value, power, crit, kill, move: m.n });
  if (kill) { e.st = 'dead'; e.dead = 0; kills++; }
}
const bearing = (e) => { let a = Math.atan2(e.z - P.z, e.x - P.x) - P.face; return Math.atan2(Math.sin(a), Math.cos(a)); };
function strike(m) {   // 한 번에 맞는 동작(사선·찌르기 등): 리치 안, 정면 허용각 안
  enemies.forEach((e) => { if (e.st === 'dead') return;
    if (Math.hypot(e.x - P.x, e.z - P.z) <= m.reach && Math.abs(bearing(e)) <= m.arc * D) hitEnemy(e, m); });
}
function sweepHits(m, prev, cur) {   // 휩쓰는 동작(수평·돌려베기): 칼날이 적의 방향을 지나는 순간 맞는다 → 360°도 순서대로
  const lo = Math.min(prev, cur), hi = Math.max(prev, cur);
  enemies.forEach((e) => { if (e.st === 'dead' || atk.hit.has(e) || Math.hypot(e.x - P.x, e.z - P.z) > m.reach) return;
    const b = bearing(e);
    if ([-1, 0, 1].some((k) => b + k * 6.2832 >= lo && b + k * 6.2832 <= hi)) { atk.hit.add(e); hitEnemy(e, m); } });
}

/* ---------- 공격: 흡착 → 동작 → 명중 ---------- */

  step(sec, fps = 60) { const n = Math.round(sec * fps); let f; for (let i = 0; i < n; i++) f = tick(1 / fps); return f && { dt: f.dt, frozen: f.frozen, cam: f.cam }; },
  tp(x, z) { P.x = x; P.z = z; }, enemies: () => enemies, player: P, gf: GameFeel,
  state: () => ({ kills, hp: P.hp, dead, enemies: enemies.map((e) => ({ st: e.st, hp: +e.hp.toFixed(2), x: +e.x.toFixed(2), z: +e.z.toFixed(2), el: e.el })), lastKey, lastMove, lastStop, drops: drops.length, parts: fx.parts.length, trails: fx.trails.length, gl: !!fx.gl }),
};
